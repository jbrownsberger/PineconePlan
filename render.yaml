services:
  - type: web
    name: family-planner
    env: node
    buildCommand: npm run build && npm install --prefix server
    startCommand: cd server && node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: family-planner-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: family-planner-db
    plan: free
